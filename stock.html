<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>个股快照 · 老张胡辣汤</title>
<style>
  :root{
    --bg:#f5f6f8; --card:#fff; --ink:#1f2329; --sub:#8a9099; --line:#eceef1;
    --accent:#2563eb; --up:#e0392b; --down:#1ba784;      /* A股口径：红涨绿跌 */
    --pick:#2563eb; --hold:#0ea5e9; --gap-block:28px;
    --amber:#f59e0b; --violet:#7c5cff; --teal:#0d9488;
  }
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
  body{margin:0 auto;max-width:860px;min-height:100dvh;padding:28px 16px 56px;
    background:var(--bg);color:var(--ink);
    font-family:-apple-system,BlinkMacSystemFont,"PingFang SC","Microsoft YaHei",sans-serif;line-height:1.6}
  a{color:inherit}
  .back{display:inline-block;font-size:12px;color:var(--sub);text-decoration:none;margin-bottom:8px}
  .back:hover{color:var(--accent)}
  .head{display:flex;align-items:flex-end;justify-content:space-between;gap:12px;margin-bottom:14px}
  .head h1{font-size:20px;margin:0;font-weight:800}
  .stamp{font-size:11px;color:var(--sub);text-align:right;line-height:1.5}
  .stamp b{color:var(--ink);font-weight:600}

  .chips{display:flex;flex-wrap:wrap;gap:8px;margin-bottom:var(--gap-block)}
  .chip{font-size:12px;padding:5px 11px;border-radius:999px;border:1px solid var(--line);
    background:var(--card);cursor:pointer;white-space:nowrap;transition:.15s}
  .chip:hover{border-color:#c9d3e3}
  .chip.on{color:#fff;border-color:transparent;font-weight:700}
  .chip.pick.on{background:var(--pick)} .chip.holding.on{background:var(--hold)}
  .chip .tag{font-size:10px;opacity:.75;margin-left:4px}

  .card{background:var(--card);border:1px solid var(--line);border-radius:16px;
    padding:18px;box-shadow:0 1px 3px rgba(0,0,0,.05);margin-bottom:14px}
  .card h2{font-size:13px;margin:0 0 12px;font-weight:700;display:flex;align-items:center;gap:7px}
  .card h2::before{content:"";width:3px;height:13px;border-radius:2px;background:var(--accent)}
  .card h2 small{color:var(--sub);font-weight:400;font-size:11px;margin-left:auto}

  .hero-top{display:flex;align-items:flex-start;justify-content:space-between;gap:14px;flex-wrap:wrap}
  .hero-name{font-size:22px;font-weight:800}
  .hero-code{font-size:12px;color:var(--sub);font-family:ui-monospace,Consolas,monospace;margin-left:8px}
  .hero-biz{font-size:12px;color:var(--sub);line-height:1.6;margin-top:6px;max-width:560px}
  .hero-role{font-size:11px;padding:2px 8px;border-radius:6px;margin-left:8px;vertical-align:2px}
  .r-pick{background:#eef4ff;color:var(--pick)} .r-hold{background:#e8f7fd;color:#0369a1}
  .hero-px{text-align:right}
  .hero-px .p{font-size:32px;font-weight:800;line-height:1.1;font-variant-numeric:tabular-nums}
  .hero-px .c{font-size:13px;font-weight:700}
  .up{color:var(--up)} .down{color:var(--down)} .flat{color:var(--sub)}
  .hero-meta{display:flex;flex-wrap:wrap;gap:8px;margin-top:12px}
  .boards{display:flex;flex-wrap:wrap;gap:6px;align-items:center;margin-top:12px;
    padding-top:12px;border-top:1px dashed var(--line)}
  .b-lab{font-size:11px;color:var(--sub);margin-right:2px}
  .bt{font-size:11px;background:#f2f5fa;border:1px solid var(--line);border-radius:6px;padding:2px 8px;color:#3b4757}
  .bt.ind{background:#eef4ff;border-color:#cfe0fb;color:var(--pick);font-weight:600}
  .bt.oth{background:#fafbfc;color:var(--sub)}
  .bt.ths{background:#eefaf3;border-color:#bde5cd;color:#0a6b3f}
  .bt em{font-style:normal;margin-left:4px;font-size:9px;opacity:.75}
  .m{font-size:11px;background:var(--bg);border:1px solid var(--line);border-radius:8px;padding:3px 9px;color:var(--sub)}
  .m b{color:var(--ink);font-variant-numeric:tabular-nums}
  .live{font-size:10px;color:var(--pick);margin-top:4px}

  .kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:10px}
  .kpi{border:1px solid var(--line);border-radius:12px;padding:12px 14px;background:#fcfdfe}
  .kpi .t{font-size:11px;color:var(--sub);margin-bottom:4px}
  .kpi .v{font-size:21px;font-weight:800;font-variant-numeric:tabular-nums;line-height:1.2}
  .kpi .v i{font-style:normal;font-size:12px;font-weight:600;color:var(--sub);margin-left:2px}
  .kpi .y{font-size:11px;margin-top:2px}

  .zone{margin-top:4px}
  .zone-bar{position:relative;height:10px;border-radius:5px;background:#eef1f5;margin:26px 0 0}
  .zone-band{position:absolute;top:-4px;bottom:-4px;background:rgba(37,99,235,.18);
    border-left:1px solid var(--pick);border-right:1px solid var(--pick)}
  .zone-stop{position:absolute;top:-4px;bottom:-4px;border-left:2px dashed var(--up)}
  .zone-now{position:absolute;top:-12px;bottom:-12px;width:2px;background:var(--ink);border-radius:1px}
  .zone-lab{position:absolute;font-size:10px;color:var(--ink);font-weight:700;white-space:nowrap;
    transform:translateX(-50%);top:-26px}
  .zone-legend{display:flex;flex-wrap:wrap;gap:6px 14px;margin-top:12px;font-size:11.5px;color:var(--sub)}
  .zone-legend span{display:inline-flex;align-items:center;gap:5px;white-space:nowrap}
  .zone-legend i{width:9px;height:9px;border-radius:2px;display:inline-block}
  .zone-legend b{color:var(--ink);font-variant-numeric:tabular-nums}
  .zone-txt{font-size:12px;color:var(--sub);margin-top:8px}
  .zone-txt b{color:var(--ink)}

  svg{display:block;width:100%;height:auto;overflow:visible}
  .bar-legend,.donut-legend{display:flex;flex-wrap:wrap;gap:12px;font-size:11px;color:var(--sub);margin-top:10px}
  .sw{display:inline-block;width:9px;height:9px;border-radius:2px;margin-right:5px;vertical-align:0}
  .donut-wrap{display:flex;gap:18px;align-items:center;flex-wrap:wrap}
  .donut-wrap svg{width:150px;flex:0 0 150px}
  .dl{flex:1 1 200px;min-width:0}
  .dl div{display:flex;justify-content:space-between;gap:10px;font-size:12px;padding:4px 0;border-bottom:1px dashed var(--line)}
  .dl div:last-child{border-bottom:0}
  .dl .n{flex:1;min-width:0;white-space:normal;line-height:1.45}
  .dl .v{font-variant-numeric:tabular-nums;color:var(--sub);text-align:right;white-space:nowrap;padding-left:10px}
  .dl .v em{display:block;font-style:normal;font-size:10px;color:var(--sub);opacity:.85}
  .dl .v b{color:var(--ink)}

  .tw{overflow-x:auto;-webkit-overflow-scrolling:touch}
  .tw table{min-width:540px}
  table{width:100%;border-collapse:collapse;font-size:12px}
  th,td{text-align:right;padding:7px 6px;border-bottom:1px solid var(--line);font-variant-numeric:tabular-nums}
  th:first-child,td:first-child{text-align:left}
  th{color:var(--sub);font-weight:600;font-size:11px;white-space:nowrap}
  tbody tr:hover{background:#fbfcfe}
  td.nm{white-space:nowrap;max-width:150px;overflow:hidden;text-overflow:ellipsis}
  .pct-bar{height:5px;border-radius:3px;background:var(--line);position:relative;margin-top:3px}
  .pct-bar i{position:absolute;left:0;top:0;bottom:0;border-radius:3px;background:var(--accent)}

  .two{display:grid;grid-template-columns:1fr 1fr;gap:14px}
  @media(max-width:700px){.two{grid-template-columns:1fr}}
  .note{font-size:11px;color:var(--sub);line-height:1.7}
  .foot{font-size:11px;color:var(--sub);text-align:center;margin-top:22px;line-height:1.8}
  .warn{background:#fffbeb;border:1px solid #fde68a;color:#92400e;border-radius:10px;padding:8px 12px;font-size:11px;margin-bottom:14px}
  .btn{font-size:12px;padding:6px 12px;border-radius:9px;border:1px solid #c9d6ea;background:#f6f9ff;color:var(--pick);cursor:pointer;font-weight:600}
  .btn:active{transform:translateY(1px)}
  .btn[disabled]{opacity:.55;cursor:wait}
  .skel{color:var(--sub);font-size:13px;padding:30px;text-align:center}
  .tip{position:fixed;z-index:9;background:#1f2329;color:#fff;font-size:11px;line-height:1.5;
    padding:5px 9px;border-radius:7px;pointer-events:none;opacity:0;transition:opacity .12s;
    white-space:nowrap;box-shadow:0 2px 10px rgba(0,0,0,.22)}
  .tip b{font-variant-numeric:tabular-nums}
  svg rect[data-tip],svg circle[data-tip]{cursor:pointer;transition:opacity .12s}
  svg rect[data-tip]:hover,svg circle[data-tip]:hover{opacity:.72}
</style>
</head>
<body>
<a class="back" href="./">← 返回工具箱</a>
<div class="head">
  <h1>📈 个股快照</h1>
  <div class="stamp" id="stamp">加载中…</div>
</div>
<div id="warn"></div>
<div class="chips" id="chips"></div>
<div id="app"><div class="card"><div class="skel">正在读取 stock_cards.json …</div></div></div>
<div class="foot" id="foot"></div>
<div class="tip" id="tip"></div>

<script>
const RAW_DATA = 'https://raw.githubusercontent.com/homjanon/xiaoxu-fear/main/output/stock_cards.json';
const LOCAL = /^(localhost|127\.0\.0\.1)$/.test(location.hostname);
const DATA_URL = new URLSearchParams(location.search).get('data') || (LOCAL ? 'output/stock_cards.json' : RAW_DATA);
let DOC = null, CUR = null;

const esc = s => String(s == null ? '' : s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const fmt = (v, d = 2) => v == null || isNaN(v) ? '—' : Number(v).toLocaleString('zh-CN', {minimumFractionDigits:0, maximumFractionDigits:d});
const pct = v => v == null || isNaN(v) ? '—' : (v > 0 ? '+' : '') + Number(v).toFixed(2) + '%';
const cls = v => v == null ? 'flat' : v > 0 ? 'up' : v < 0 ? 'down' : 'flat';
const code2tx = c => (c[0] === '6' || c[0] === '5' || c[0] === '9' || c[0] === '8' ? 'sh' : 'sz') + c;

const LIVE_KEY = 'qg.stock.live.';
/* 缓存 key 用北京日无意义了（不设过期），只按标的存一份 */
/* 行情时刻是否就是北京今天：不是的话不能叫"实时价"（盘前/周末拿到的是上一交易日收盘） */
const bjToday = () => new Date(Date.now() + 8 * 3600 * 1000).toISOString().slice(0, 10);
const liveIsToday = at => String(at || '').slice(0, 8) === bjToday().replace(/-/g, '');
/* 腾讯回传的行情时刻 20261012161435 → 2026.10.12 16:14（保留到分钟） */
function fmtAt(at){
  const s = String(at || '').replace(/\D/g, '');
  if (s.length < 12) return at || '';
  return `${s.slice(0, 4)}.${s.slice(4, 6)}.${s.slice(6, 8)} ${s.slice(8, 10)}:${s.slice(10, 12)}`;
}
/* 缓存不设过期：查到就存，一直用到下一次手动刷新为止（用户 2026-10-13 定的口径） */
function liveGet(code){
  try{ const raw = localStorage.getItem(LIVE_KEY + code); return raw ? JSON.parse(raw) : null; }
  catch(e){ return null; }
}
async function liveFetch(codes){
  /* 实时价只走腾讯直连（qt.gtimg.cn 实测自带 Access-Control-Allow-Origin: *），不经 CORS 代理 */
  const url = 'https://qt.gtimg.cn/q=' + codes.map(code2tx).join(',');
  const r = await fetch(url, {cache:'no-store'});
  if(!r.ok) throw new Error('HTTP ' + r.status);
  const text = new TextDecoder('gbk').decode(await r.arrayBuffer());
  if(!text.includes('~')) throw new Error('腾讯返回异常');
  const out = {};
  for(const line of text.split('\n')){
    if(!line.includes('"')) continue;
    const f = line.split('"')[1].split('~');
    if(f.length < 47) continue;
    out[f[2]] = {price:+f[3], chg_pct:+f[32], at:(f[30]||'').slice(0,14)};
  }
  for(const c in out){
    try{ localStorage.setItem(LIVE_KEY + c, JSON.stringify(out[c])); }catch(e){}
  }
  return out;
}

/* ---------- 渲染 ---------- */
function boardsRow(s){
  const main = s.industry || '';
  const bi = (s.board_industry || []).filter(x => x !== main);
  const con = s.concepts || [], oth = s.board_other || [];
  if(!main && !bi.length && !con.length && !oth.length) return '';
  const tag = (x, c) => `<span class="bt ${c || ''}">${esc(x)}</span>`;
  let h = '<div class="boards">';
  if(main || bi.length) h += `<span class="b-lab">所属行业</span>${main ? tag(main, 'ind') : ''}${bi.slice(0, 3).map(x => tag(x)).join('')}`;
  const conLabel = s.boards_basis === 'em-list' ? '概念板块' : '概念/题材';
  const ths = s.concept_ths || [];
  if(con.length) h += `<span class="b-lab" style="margin-left:8px">${conLabel}</span>`
    + con.slice(0, 2).map(x => `<span class="bt${ths.includes(x) ? ' ths' : ''}">${esc(x)}${ths.includes(x) ? '<em title="同花顺概念表亦收录">✓</em>' : ''}</span>`).join('')
    + (con.length > 2 ? `<span class="bt oth" title="${esc(con.slice(2).join('、'))}">+${con.length - 2}</span>` : '');
  if(oth.length) h += `<span class="b-lab" style="margin-left:8px">地域/指数</span>${oth.slice(0, 4).map(x => tag(x, 'oth')).join('')}${oth.length > 4 ? `<span class="bt oth">+${oth.length - 4}</span>` : ''}`;
  if(s.boards_basis !== 'em-list' && (con.length || oth.length)) h += `<span class="b-lab" style="margin-left:6px;opacity:.7" title="东财板块全量清单当日不可用，已按行业/地域/风格标签做减法归类">非官方概念表</span>`;
  return h + '</div>';
}

function zoneBar(s, livePrice){
  /* 买区判断必须跟着最新价走：手动刷新过就用实时价，否则用日更快照价。
     2026-10-13 用户实测发现它一直用快照价 → 刷新后"是否进买区"不跟着变。 */
  const price = livePrice != null ? livePrice : s.quote.price;
  const zone = (s.buy_zone || '').match(/([\d.]+)\s*[-~]\s*([\d.]+)/);
  const stop = s.stop_loss;
  if(!price) return '';
  const pts = [price];
  if(zone){ pts.push(+zone[1], +zone[2]); }
  if(stop != null){ pts.push(+stop); }
  if(s.ref_price){ pts.push(s.ref_price); }
  let lo = Math.min(...pts), hi = Math.max(...pts);
  const pad = (hi - lo) * 0.18 || hi * 0.03;
  lo -= pad; hi += pad;
  const x = v => Math.max(0, Math.min(100, (v - lo) / (hi - lo) * 100));
  const px = x(price);
  /* 现价标签贴着画布边缘时改成单侧对齐，避免被裁掉 */
  const labStyle = px < 14 ? 'left:0;transform:none' : px > 86 ? 'left:auto;right:0;transform:none' : `left:${px}%`;
  let inner = '';
  if(zone){
    const a = x(+zone[1]), b = x(+zone[2]);
    inner += `<div class="zone-band" style="left:${a}%;width:${Math.max(1,b-a)}%"></div>`;
  }
  if(stop != null){ inner += `<div class="zone-stop" style="left:${x(stop)}%"></div>`; }
  inner += `<div class="zone-now" style="left:${px}%"></div>
    <div class="zone-lab" style="${labStyle}">现价 ${fmt(price)}</div>`;
  const legend = [];
  if(zone){ legend.push(`<span><i style="background:rgba(37,99,235,.22);border:1px solid var(--pick)"></i>回踩买区 <b>${zone[1]}–${zone[2]}</b></span>`); }
  if(stop != null){ legend.push(`<span><i style="background:var(--up)"></i>止损 <b>${fmt(stop)}</b></span>`); }
  if(s.ref_price){ legend.push(`<span><i style="background:#c9d3e3"></i>报告时价 <b>${fmt(s.ref_price)}</b></span>`); }
  const inZone = zone && price <= +zone[2] && price >= +zone[1];
  const verdict = zone
    ? (inZone ? '<b style="color:var(--down)">已进买区</b>'
       : price > +zone[2] ? `<b>还差 ${((price / +zone[2] - 1) * 100).toFixed(1)}% 回踩到位</b>`
       : '<b style="color:var(--up)">已跌破买区下沿，按纪律不接</b>')
    : '';
  return `<div class="zone">
    <div class="zone-bar" data-tip="现价 <b>${fmt(price)}</b>${zone ? ` · 买区 <b>${zone[1]}–${zone[2]}</b>` : ''}${stop != null ? ` · 止损 <b>${fmt(stop)}</b>` : ''}">${inner}</div>
    <div class="zone-legend">${legend.join('')}</div>
    <div class="zone-txt">${esc(s.buy_zone || '')} ${s.plan ? '· ' + esc(s.plan) : ''} ${verdict ? '· ' + verdict : ''}</div>
  </div>`;
}

function barChart(hist){
  if(!hist || hist.length < 2) return '<div class="note">历史财务数据不足，暂不出图。</div>';
  const W = 560, H = 190, PL = 34, PR = 30, PT = 12, PB = 26;
  const max = Math.max(...hist.map(h => Math.max(h.rev_yi || 0, h.np_yi || 0))) * 1.12 || 1;
  const bw = (W - PL - PR) / hist.length;
  let bars = '', line = '', labels = '';
  hist.forEach((h, i) => {
    const cx = PL + bw * i + bw / 2;
    const rh = (h.rev_yi || 0) / max * (H - PT - PB), nh = (h.np_yi || 0) / max * (H - PT - PB);
    const fill = h.interim ? '#c7d6f0' : '#1f3a5f';
    const yr = esc(h.y) + (h.interim ? '（中期）' : '');
    bars += `<rect x="${cx - bw * .30}" y="${H - PB - rh}" width="${bw * .26}" height="${Math.max(0, rh)}" fill="${fill}" rx="2"
        data-tip="${yr} · 营业总收入 <b>${fmt(h.rev_yi)} 亿</b>"></rect>
      <rect x="${cx + bw * .05}" y="${H - PB - nh}" width="${bw * .26}" height="${Math.max(0, nh)}" fill="#9db6d8" rx="2"
        data-tip="${yr} · 归母净利润 <b>${fmt(h.np_yi)} 亿</b>"></rect>`;
    labels += `<text x="${cx}" y="${H - 8}" font-size="10" fill="#8a9099" text-anchor="middle">${esc(h.y)}</text>`;
    if(h.rev_yi && h.np_yi != null){
      const nm = (h.np_yi / h.rev_yi * 100);
      const y = PT + (1 - (h.np_yi / h.rev_yi)) * (H - PT - PB) * .9;
      line += `<circle cx="${cx}" cy="${y}" r="4" fill="#f59e0b"
          data-tip="${yr} · 净利率 <b>${fmt(nm)}%</b>"></circle>`;
    }
  });
  let path = '';
  const pts = hist.map((h, i) => (h.rev_yi && h.np_yi != null)
    ? [PL + bw * i + bw / 2, PT + (1 - (h.np_yi / h.rev_yi)) * (H - PT - PB) * .9] : null).filter(Boolean);
  if(pts.length > 1) path = `<polyline points="${pts.map(p => p.join(',')).join(' ')}" fill="none" stroke="#f59e0b" stroke-width="1.6"></polyline>`;
  return `<svg viewBox="0 0 ${W} ${H}" role="img" aria-label="营收与净利润">
      <line x1="${PL}" y1="${H - PB}" x2="${W - PR}" y2="${H - PB}" stroke="#eceef1"></line>
      <text x="${PL - 5}" y="${H - PB}" font-size="9" fill="#8a9099" text-anchor="end">0</text>
      <text x="${PL - 5}" y="${PT + 4}" font-size="9" fill="#8a9099" text-anchor="end">${fmt(max / 1.12, 0)}</text>
      ${bars}${path}${line}${labels}</svg>
    <div class="bar-legend">
      <span><i class="sw" style="background:#1f3a5f"></i>营业总收入(亿)</span>
      <span><i class="sw" style="background:#9db6d8"></i>归母净利润(亿)</span>
      <span><i class="sw" style="background:#f59e0b"></i>净利率</span>
      <span style="color:#8a9099">浅色柱 = 中期报告期</span></div>`;
}

function donut(segs, basis, period, fin){
  if(!segs || !segs.length) return '<div class="note">主营构成数据缺失。</div>';
  const R = 52, C = 2 * Math.PI * R, colors = ['#1f3a5f','#3f6fb0','#9db6d8','#c7d6f0','#e2eaf6','#f59e0b','#0d9488','#7c5cff'];
  const annual = period && period.endsWith('12-31');
  /* 圆心数字优先用同报告期的营业总收入（权威口径），取不到再退回各项之和 */
  const sum = segs.reduce((a, s) => a + (s.rev_yi || 0), 0);
  const total = (fin && fin.period === period && fin.revenue_yi != null) ? fin.revenue_yi : (sum ? +sum.toFixed(2) : null);
  let off = 0, arcs = '', hits = '';
  segs.forEach((s, i) => {
    const len = (s.pct || 0) / 100 * C, color = colors[i % colors.length];
    const tip = `${esc(s.name)} · 占比 <b>${fmt(s.pct)}%</b> · ${fmt(s.rev_yi)} 亿`
              + (s.gm != null ? ` · 毛利率 <b>${fmt(s.gm)}%</b>` : '');
    arcs += `<circle cx="75" cy="75" r="${R}" fill="none" stroke="${color}" stroke-width="20"
      stroke-dasharray="${len} ${C - len}" stroke-dashoffset="${-off}" transform="rotate(-90 75 75)"></circle>`;
    hits += `<circle cx="75" cy="75" r="${R}" fill="none" stroke="rgba(0,0,0,0)" stroke-width="30"
      stroke-dasharray="${len} ${C - len}" stroke-dashoffset="${-off}" transform="rotate(-90 75 75)"
      style="cursor:pointer" data-tip="${tip}"></circle>`;
    off += len;
  });
  return `<div class="donut-wrap"><svg viewBox="0 0 150 150" role="img" aria-label="主营构成">${arcs}${hits}
      <text x="75" y="70" font-size="14" font-weight="700" fill="#1f2329" text-anchor="middle">${total == null ? '—' : fmt(total)}</text>
      <text x="75" y="86" font-size="9" fill="#8a9099" text-anchor="middle">${annual ? '年度主营收入' : '主营收入'} · 亿元</text>
      <text x="75" y="99" font-size="8.5" fill="#b0b7c0" text-anchor="middle">${esc(period || '')}</text></svg>
    <div class="dl">${segs.map((s, i) => `<div data-tip="${esc(s.name)} · 占比 <b>${fmt(s.pct)}%</b> · ${fmt(s.rev_yi)} 亿${s.gm != null ? ' · 毛利率 ' + fmt(s.gm) + '%' : ''}" style="cursor:pointer">
      <span class="n"><i class="sw" style="background:${colors[i % colors.length]}"></i>${esc(s.name)}</span>
      <span class="v"><b>${fmt(s.pct)}%</b>${s.gm != null ? `<em>毛利率 ${fmt(s.gm)}%</em>` : ''}</span></div>`).join('')}
    </div></div><div class="note" style="margin-top:8px">口径：按${esc(basis || '产品')}分类 · 报告期 ${esc(period || '—')}${annual ? '' : '（中期，非全年）'}</div>`;
}

function holders(s){
  if(!s.holders || !s.holders.length) return '<div class="note">股东数据缺失。</div>';
  return `<div class="tw"><table><thead><tr><th>名次</th><th style="text-align:left">股东名称</th><th>性质</th><th>持股比例</th></tr></thead><tbody>
    ${s.holders.map(h => `<tr><td>${h.rank}</td><td class="nm" style="text-align:left">${esc(h.name)}</td>
      <td style="color:var(--sub)">${esc(h.type)}</td><td><b>${fmt(h.pct)}%</b></td></tr>`).join('')}
    </tbody></table></div>
    <div class="note" style="margin-top:8px">前十大合计 <b>${fmt(s.top10_pct)}%</b>。
    注：不预设"控股股东"三段式——部分标的（如银行）无单一控股股东，硬套会误导。</div>`;
}

function render(s){
  const q = s.quote || {}, f = s.fin || {};
  const live = liveGet(s.code);
  const price = live ? live.price : q.price;
  const chg = live ? live.chg_pct : q.chg_pct;
  const kpi = (t, v, unit, yoy) => `<div class="kpi"><div class="t">${t}</div>
      <div class="v">${v == null ? '—' : fmt(v)}${v != null ? `<i>${unit}</i>` : ''}</div>
      <div class="y ${cls(yoy)}">${yoy == null ? '' : pct(yoy) + ' 同比'}</div></div>`;
  return `
  <div class="card">
    <div class="hero-top">
      <div><span class="hero-name">${esc(s.name)}</span><span class="hero-code">${esc(s.code)}</span>
        <span class="hero-role ${s.role === 'pick' ? 'r-pick' : 'r-hold'}">${s.role === 'pick' ? '今日精选' : '当前持仓'}</span>
        ${s.profile ? `<div class="hero-biz">${esc(s.profile)}</div>` : ''}
        ${s.action ? `<div class="note" style="margin-top:5px">${esc(s.action)}</div>` : ''}</div>
      <div class="hero-px"><div class="p ${cls(chg)}">${fmt(price)}</div>
        <div class="c ${cls(chg)}">${pct(chg)} ${chg != null ? (chg > 0 ? '↑' : chg < 0 ? '↓' : '→') : ''}</div>
        ${live ? `<div class="live">${liveIsToday(live.at) ? '实时价 · ' + esc(fmtAt(live.at))
                 : '非当日行情 · 腾讯回传 ' + esc(fmtAt(live.at)) + '（盘前/休市拿到的是上一交易日收盘）'}</div>` : ''}</div>
    </div>
    <div class="hero-meta">
      <span class="m">总市值 <b>${fmt(q.cap_yi)}亿</b></span>
      <span class="m">PE(TTM) <b>${fmt(q.pe_ttm)}</b></span>
      <span class="m">PB <b>${fmt(q.pb)}</b></span>
      <span class="m">换手 <b>${fmt(q.turnover_pct)}%</b></span>
      <span class="m">成交额 <b>${q.amount_wan == null ? '—' : fmt(q.amount_wan / 1e4)}亿</b></span>
      <span class="m">今日高/低 <b>${fmt(q.high)} / ${fmt(q.low)}</b></span>
      ${s.range_52w ? `<span class="m">52周高/低 <b>${fmt(s.range_52w.high)} / ${fmt(s.range_52w.low)}</b></span>` : ''}
      <button class="btn" id="btnLive" style="margin-left:auto">刷新价格</button>
    </div>
    ${boardsRow(s)}
    ${s.buy_zone || s.stop_loss != null ? `<div style="margin-top:16px"><div class="note" style="margin-bottom:2px">回踩买区与止损</div>${zoneBar(s, price)}</div>` : ''}
  </div>

  <div class="card"><h2>关键财务 <small>年报 ${esc(f.period || '—')}</small></h2>
    <div class="kpis">${kpi('营业总收入', f.revenue_yi, '亿', f.revenue_yoy)}
      ${kpi('归母净利润', f.np_yi, '亿', f.np_yoy)}
      ${kpi('销售毛利率', f.gross_margin, '%', null)}
      ${kpi('净资产收益率', f.roe, '%', null)}</div>
    ${f.eps != null ? `<div class="note" style="margin-top:10px">基本每股收益 ${fmt(f.eps)} 元</div>` : ''}
    ${f.interim ? `<div class="note" style="margin-top:4px">最新中期 ${esc(f.interim.period)}：营收 ${fmt(f.interim.revenue_yi)} 亿 · 归母 ${fmt(f.interim.np_yi)} 亿 · ROE ${fmt(f.interim.roe)}%　<span style="opacity:.75">（${esc(f.interim.note || '')}）</span></div>` : ''}
  </div>

  <div class="two">
    <div class="card"><h2>营收与净利润 <small>亿元 · 已披露口径</small></h2>${barChart(s.history)}</div>
    <div class="card"><h2>主营构成 <small>收入占比</small></h2>${donut(s.segments, s.segments_basis, s.segments_period, s.fin)}</div>
  </div>

  <div class="card"><h2>前十大股东</h2>${holders(s)}</div>
  ${s.missing && s.missing.length ? `<div class="warn">本期缺失字段：${esc(s.missing.join('、'))}（显示为 —，未用 0 填充）</div>` : ''}`;
}

function paint(){
  const s = DOC.stocks.find(x => x.code === CUR) || DOC.stocks[0];
  if(!s){ document.getElementById('app').innerHTML = '<div class="card"><div class="skel">报告里没有标的。</div></div>'; return; }
  CUR = s.code;
  document.getElementById('chips').innerHTML = DOC.stocks.map(x =>
    `<button class="chip ${x.role} ${x.code === CUR ? 'on' : ''}" data-c="${esc(x.code)}">${esc(x.name)}<span class="tag">${x.role === 'pick' ? '精选' : '持仓'}</span></button>`).join('');
  document.querySelectorAll('.chip').forEach(c => c.onclick = () => { CUR = c.dataset.c; history.replaceState(null, '', '?code=' + CUR); paint(); });
  document.getElementById('app').innerHTML = render(s);
  const btn = document.getElementById('btnLive');
  if(btn) btn.onclick = async () => {
    btn.disabled = true; btn.textContent = '拉取中…';
    try{ await liveFetch(DOC.stocks.map(x => x.code)); btn.textContent = '已更新'; paint(); }
    catch(e){ btn.textContent = '实时价不可用'; }
    setTimeout(() => { const b = document.getElementById('btnLive'); if(b){ b.disabled = false; if(b.textContent === '已更新') b.textContent = '刷新价格'; } }, 1600);
  };
  document.title = `${s.name} 个股快照 · 老张胡辣汤`;
}

async function loadDoc(){
  /* 本地预览读同目录产物；放进 nav 仓时直接走 GitHub 三级加速。
     顺序固定为 代理 → 直连 → jsdelivr —— jsdelivr 有 12h 缓存，只能兜底，不得提前。 */
  const cdn = u => ['https://proxy.hellohopo.dpdns.org/?url=' + encodeURIComponent(u), u,
                   'https://cdn.jsdelivr.net/gh/homjanon/xiaoxu-fear@main/output/stock_cards.json'];
  const urls = LOCAL ? [DATA_URL, ...cdn(RAW_DATA)] : cdn(RAW_DATA);
  let last = new Error('无可用数据地址');
  for(const u of urls){
    try{ const r = await fetch(u, {cache:'no-store'}); if(r.ok) return await r.json(); last = new Error('HTTP ' + r.status); }
    catch(e){ last = e; }
  }
  throw last;
}

async function boot(){
  const want = new URLSearchParams(location.search).get('code');
  try{
    DOC = await loadDoc();
  }catch(e){
    document.getElementById('app').innerHTML = `<div class="card"><div class="skel">读不到 stock_cards.json：${esc(e.message)}</div></div>`;
    return;
  }
  if(want) CUR = want;
  const idx = DOC.index || {};
  document.getElementById('stamp').innerHTML =
    `生成 <b>${esc((DOC.generated_at || '').slice(5, 16).replace('T', ' '))}</b>`;
  if(idx.close != null){
    document.getElementById('warn').innerHTML =
      `<div class="warn">${esc((DOC.report_summary || '').replace(/\*\*/g, ''))}　<span class="flat">${esc(idx.name || '')} ${fmt(idx.close)}（${pct(idx.change_pct)}）</span></div>`;
  }
  paint();
  document.getElementById('foot').innerHTML =
    `${esc(DOC.data_note || '')}<br>数据来源：腾讯行情 · 东财财务/主营/股东 · 巨潮简介（星耀数智可选）· 标的清单来自秋哥操作日报<br>
     仅供研究，不构成投资建议。`;
}
/* 图表悬浮数值：事件委托，切换标的后不用重新绑定 */
const TIP = { el: null, on: false };
function tipAt(e){
  if(!TIP.el) return;
  const w = TIP.el.offsetWidth, h = TIP.el.offsetHeight;
  let x = e.clientX + 12, y = e.clientY - h - 10;
  if(x + w > innerWidth - 8) x = innerWidth - w - 8;
  if(y < 8) y = e.clientY + 16;
  TIP.el.style.left = x + 'px'; TIP.el.style.top = y + 'px';
}
document.addEventListener('mouseover', e => {
  const t = e.target.closest && e.target.closest('[data-tip]');
  if(!TIP.el) TIP.el = document.getElementById('tip');
  if(!TIP.el) return;
  if(t){ TIP.el.innerHTML = t.getAttribute('data-tip'); TIP.el.style.opacity = 1; TIP.on = true; tipAt(e); }
  else if(TIP.on){ TIP.el.style.opacity = 0; TIP.on = false; }
});
document.addEventListener('mousemove', e => { if(TIP.on) tipAt(e); });
document.addEventListener('mouseout', e => {
  if(TIP.el && !e.relatedTarget?.closest?.('[data-tip]')){ TIP.el.style.opacity = 0; TIP.on = false; }
});

boot();
</script>
